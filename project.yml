name: ClaudePDF
options:
  bundleIdPrefix: dev.jerryfan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  ClaudePDF:
    type: application
    platform: macOS
    sources:
      - path: ClaudePDF
    info:
      path: ClaudePDF/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jerryfan.ClaudePDF
        # Hardened runtime for eventual Developer ID notarization.
        # No App Sandbox — required for the Claude Code CLI provider (see PLAN.md §1).
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

  ClaudePDFTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClaudePDFTests
      # Compiled into the test bundle rather than tested through a host app: the app is a
      # DocumentGroup, and a host-app test run would launch it (and its open panel) headlessly.
      # These files are deliberately free of app state so they can be linked standalone.
      - path: ClaudePDF/Selection/CropGeometry.swift
      - path: ClaudePDF/Selection/CropRenderer.swift
      - path: ClaudePDF/Selection/CropOverlay.swift
      - path: ClaudePDF/Selection/QuestionAnchor.swift
      - path: ClaudePDF/Viewer/PDFViewerView.swift
      - path: ClaudePDF/Providers/ChatProvider.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jerryfan.ClaudePDFTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ClaudePDF:
    build:
      targets:
        ClaudePDF: all
        ClaudePDFTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClaudePDFTests
