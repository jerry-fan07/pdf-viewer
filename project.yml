name: ClaudePDF
options:
  bundleIdPrefix: dev.jerryfan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
packages:
  # Native LaTeX typesetting for chat answers. The one dependency the app takes:
  # the alternative (KaTeX in a WKWebView per chat card) is heavier and can't put
  # math inline in a SwiftUI Text run. See PLAN.md §6.
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    from: "1.7.3"
targets:
  ClaudePDF:
    type: application
    platform: macOS
    sources:
      - path: ClaudePDF
    dependencies:
      - package: SwiftMath
    info:
      path: ClaudePDF/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jerryfan.ClaudePDF
        # Hardened runtime for eventual Developer ID notarization.
        # No App Sandbox — required for the Claude Code CLI provider (see PLAN.md §1).
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  ClaudePDFTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: ClaudePDF
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jerryfan.ClaudePDFTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClaudePDF:
    build:
      targets:
        ClaudePDF: all
        ClaudePDFTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClaudePDFTests
