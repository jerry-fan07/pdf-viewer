"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# ClaudePDF.xcodeproj is generated from project.yml and gitignored, so every
# fresh workspace has to generate it before Xcode or xcodebuild can do anything.
setup = "xcodegen generate"
# Each workspace builds into its own DerivedData, so several can build at once.
run_mode = "concurrent"

[scripts.run.app]
# xcodebuild only exists on the Mac — this app can't run in a cloud workspace.
available_in = [ "local" ]
default = true
icon = "play"
# Every branch installs over the same ~/Applications/ClaudePDF.app and runs from
# there, because the Dock keys its tiles on the bundle's path: launching straight
# out of a workspace's DerivedData gives every branch a Dock icon of its own and
# leaves a pinned icon permanently dark. See Scripts/dev-install.sh.
command = "bash Scripts/dev-install.sh"

[scripts.run.app-isolated]
# The old behaviour: run out of this workspace's DerivedData, so two branches can
# be up at once. They get one Dock tile each — that is the price of side by side.
available_in = [ "local" ]
icon = "play"
# Through dev-install.sh all the same, for its signing: an ad-hoc build is a
# stranger to the keychain after every rebuild, and asks for the login password
# once per API key each time.
command = "IN_PLACE=1 bash Scripts/dev-install.sh"

[scripts.run.test]
available_in = [ "local" ]
icon = "test-tube"
command = "xcodegen generate && xcodebuild -project ClaudePDF.xcodeproj -scheme ClaudePDF -destination 'platform=macOS' -derivedDataPath DerivedData test"
